<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeDeal India</title>
<style>
body{margin:0;font-family:Arial;background:#f5f6fa;color:#222}
header{background:linear-gradient(135deg,#6c2cff,#ff4f81);color:white;text-align:center;padding:35px 15px}

button{padding:10px 15px;margin:4px;border:0;border-radius:20px;background:#eee}

.card{background:white;padding:20px;margin:15px 0;border-radius:15px;box-shadow:0 3px 12px #ddd}
.price{font-size:25px;font-weight:bold;color:#6c2cff}
a{display:inline-block;background:#6c2cff;color:white;padding:10px 18px;border-radius:8px;text-decoration:none}

<body>
<header>

</header>

<nav>

<button>Free</button>

</nav>

<main>
<div class="card">

<p>आज का शानदार Free Offer</p>

<a href="#">View Deal</a>
</div>

<div class="card">

<p>आज की खास ₹1 Deal</p>

<footer style="text-align:center;padding:30px">
© 2026 FreeDeal India
</footer>
</body>
</html>
